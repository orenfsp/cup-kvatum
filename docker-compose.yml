name: otklik

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otklik}
      POSTGRES_USER: ${POSTGRES_USER:-otklik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores versioned clusters below /var/lib/postgresql.
      # Mount the parent so container recreation keeps the active cluster.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/backend/Otklik.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-otklik};Username=${POSTGRES_USER:-otklik};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectRetry=5
      ConnectionStrings__Kafka: kafka:9092
      SeedAccounts__Operator__Password: ${OTKLIK_OPERATOR_PASSWORD:?Set OTKLIK_OPERATOR_PASSWORD in .env}
      SeedAccounts__Expert__Password: ${OTKLIK_EXPERT_PASSWORD:?Set OTKLIK_EXPERT_PASSWORD in .env}
      SeedAccounts__Administrator__Password: ${OTKLIK_ADMINISTRATOR_PASSWORD:?Set OTKLIK_ADMINISTRATOR_PASSWORD in .env}
      Security__TrackHashKey: ${OTKLIK_TRACK_HASH_KEY:?Set OTKLIK_TRACK_HASH_KEY in .env}
      Security__RateLimitHashKey: ${OTKLIK_RATE_LIMIT_HASH_KEY:?Set OTKLIK_RATE_LIMIT_HASH_KEY in .env}
      Security__TrustForwardedForFromPrivateNetworks: "true"
      Security__DataProtectionKeysPath: /var/lib/otklik/keys
      Push__PublicKey: ${OTKLIK_PUSH_PUBLIC_KEY:-BK4Ay_dUFEsJ3493pLqS4TWHFF13JWxkBrdOcqLYcifMIRrRAyN9lm0BOZ4xsmPPUogY458VrSt6pc6HXHh84a8}
      Storage__AttachmentsPath: /var/lib/otklik/attachments
    volumes:
      - api-keys:/var/lib/otklik/keys
      - attachments-data:/var/lib/otklik/attachments
    ports:
      - "127.0.0.1:${OTKLIK_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/backend/Otklik.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-otklik};Username=${POSTGRES_USER:-otklik};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectRetry=5
      ConnectionStrings__Kafka: kafka:9092
      Security__DataProtectionKeysPath: /var/lib/otklik/keys
      Push__PublicKey: ${OTKLIK_PUSH_PUBLIC_KEY:-BK4Ay_dUFEsJ3493pLqS4TWHFF13JWxkBrdOcqLYcifMIRrRAyN9lm0BOZ4xsmPPUogY458VrSt6pc6HXHh84a8}
      Push__PrivateKey: ${OTKLIK_PUSH_PRIVATE_KEY:-}
      Push__Subject: ${OTKLIK_PUSH_SUBJECT:-mailto:dev@otklik.local}
    volumes:
      - api-keys:/var/lib/otklik/keys
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "${OTKLIK_FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  integration-tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: src/backend/Otklik.Api/Dockerfile
      target: integration-test
    environment:
      OTKLIK_INTEGRATION_BASE_URL: http://api:8080/
      OTKLIK_OPERATOR_PASSWORD: ${OTKLIK_OPERATOR_PASSWORD:?Set OTKLIK_OPERATOR_PASSWORD in .env}
      OTKLIK_EXPERT_PASSWORD: ${OTKLIK_EXPERT_PASSWORD:?Set OTKLIK_EXPERT_PASSWORD in .env}
      OTKLIK_ADMINISTRATOR_PASSWORD: ${OTKLIK_ADMINISTRATOR_PASSWORD:?Set OTKLIK_ADMINISTRATOR_PASSWORD in .env}
    depends_on:
      api:
        condition: service_healthy

  e2e-tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: src/frontend/Dockerfile.e2e
    environment:
      OTKLIK_E2E_BASE_URL: http://localhost/
      OTKLIK_OPERATOR_PASSWORD: ${OTKLIK_OPERATOR_PASSWORD:?Set OTKLIK_OPERATOR_PASSWORD in .env}
      OTKLIK_EXPERT_PASSWORD: ${OTKLIK_EXPERT_PASSWORD:?Set OTKLIK_EXPERT_PASSWORD in .env}
      OTKLIK_ADMINISTRATOR_PASSWORD: ${OTKLIK_ADMINISTRATOR_PASSWORD:?Set OTKLIK_ADMINISTRATOR_PASSWORD in .env}
    depends_on:
      frontend:
        condition: service_healthy
    network_mode: "service:frontend"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  api-keys:
  attachments-data:
